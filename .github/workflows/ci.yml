name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      PUBLIC_SANITY_DATASET: ${{ vars.SANITY_DATASET }}
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @polina-vet/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:a11y
